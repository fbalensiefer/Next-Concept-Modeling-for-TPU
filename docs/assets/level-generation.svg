<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title description">
<title id="title">Generate a complete level in one evaluation</title>
<desc id="description">An illustrative hierarchy with lengths two, four, and eight requires three sequential level evaluations. All positions in a level are predicted in parallel. Code vectors accumulate between levels.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:36px;font-weight:700;fill:#10243a} .subtitle{font-size:20px;fill:#53677d} .label{font-size:22px;font-weight:700;fill:#10243a} .body{font-size:19px;fill:#53677d} .small{font-size:17px;fill:#53677d} .kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#2563eb}</style>
<rect x="0" y="0" width="1440" height="690" rx="0" fill="#f4f7fb" stroke="none"/>
<text x="44" y="44" class="kicker" text-anchor="start">NEXT-CONCEPT MODELING FOR TPU</text>
<text x="44" y="91" class="title" text-anchor="start">Generate a complete level in one evaluation</text>
<text x="44" y="127" class="subtitle" text-anchor="start">Illustrative schedule (2, 4, 8); colored blocks represent code positions, not semantic labels.</text>
<rect x="40" y="157" width="936" height="459" rx="14" fill="white" stroke="#d8e2ed"/>
<text x="70" y="237" class="label" text-anchor="start">Coarse</text>
<text x="70" y="269" class="body" text-anchor="start">k = 1  ·  n₁ = 2</text>
<rect x="356" y="211" width="54" height="58" rx="9" fill="#eaf1ff" stroke="#2563eb"/>
<text x="383" y="248" class="label" text-anchor="middle" style="fill:#2563eb">1</text>
<rect x="426" y="211" width="54" height="58" rx="9" fill="#eaf1ff" stroke="#2563eb"/>
<text x="453" y="248" class="label" text-anchor="middle" style="fill:#2563eb">2</text>
<polyline points="382,276 382,320" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="412" y="307" class="small" text-anchor="start">accumulate → resize → condition next level</text>
<text x="70" y="374" class="label" text-anchor="start">Intermediate</text>
<text x="70" y="406" class="body" text-anchor="start">k = 2  ·  n₂ = 4</text>
<rect x="356" y="348" width="54" height="58" rx="9" fill="#eaf8f4" stroke="#087f75"/>
<text x="383" y="385" class="label" text-anchor="middle" style="fill:#087f75">1</text>
<rect x="426" y="348" width="54" height="58" rx="9" fill="#eaf8f4" stroke="#087f75"/>
<text x="453" y="385" class="label" text-anchor="middle" style="fill:#087f75">2</text>
<rect x="496" y="348" width="54" height="58" rx="9" fill="#eaf8f4" stroke="#087f75"/>
<text x="523" y="385" class="label" text-anchor="middle" style="fill:#087f75">3</text>
<rect x="566" y="348" width="54" height="58" rx="9" fill="#eaf8f4" stroke="#087f75"/>
<text x="593" y="385" class="label" text-anchor="middle" style="fill:#087f75">4</text>
<polyline points="382,413 382,457" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="412" y="444" class="small" text-anchor="start">accumulate → resize → condition next level</text>
<text x="70" y="511" class="label" text-anchor="start">Fine</text>
<text x="70" y="543" class="body" text-anchor="start">k = 3  ·  n₃ = 8</text>
<rect x="356" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="383" y="522" class="label" text-anchor="middle" style="fill:#7251b5">1</text>
<rect x="426" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="453" y="522" class="label" text-anchor="middle" style="fill:#7251b5">2</text>
<rect x="496" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="523" y="522" class="label" text-anchor="middle" style="fill:#7251b5">3</text>
<rect x="566" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="593" y="522" class="label" text-anchor="middle" style="fill:#7251b5">4</text>
<rect x="636" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="663" y="522" class="label" text-anchor="middle" style="fill:#7251b5">5</text>
<rect x="706" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="733" y="522" class="label" text-anchor="middle" style="fill:#7251b5">6</text>
<rect x="776" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="803" y="522" class="label" text-anchor="middle" style="fill:#7251b5">7</text>
<rect x="846" y="485" width="54" height="58" rx="9" fill="#f3effc" stroke="#7251b5"/>
<text x="873" y="522" class="label" text-anchor="middle" style="fill:#7251b5">8</text>
<rect x="1002" y="157" width="398" height="459" rx="14" fill="#10243a" stroke="#10243a"/>
<text x="1032" y="204" class="label" text-anchor="start" style="fill:white">K level evaluations</text>
<text x="1032" y="249" class="body" style="fill:#cbd8e7" text-anchor="start">Positions are predicted together.</text>
<text x="1032" y="278" class="body" style="fill:#cbd8e7" text-anchor="start">The Transformer shares weights</text>
<text x="1032" y="307" class="body" style="fill:#cbd8e7" text-anchor="start">across hierarchy levels.</text>
<text x="1032" y="368" class="label" text-anchor="start" style="fill:#93c5fd">Conditioning</text>
<text x="1032" y="398" class="small" text-anchor="start" style="fill:#d6e0eb">Cumulative earlier-level vectors</text>
<text x="1032" y="456" class="label" text-anchor="start" style="fill:#93c5fd">Code selection</text>
<text x="1032" y="486" class="small" text-anchor="start" style="fill:#d6e0eb">Greedy argmax in this snapshot</text>
<text x="1032" y="544" class="label" text-anchor="start" style="fill:#93c5fd">Training labels</text>
<text x="1032" y="574" class="small" text-anchor="start" style="fill:#d6e0eb">Added after current logits</text>
<text x="44" y="658" class="body" text-anchor="start">Static storage is padded to L at every level. Masking preserves correctness; padding still has a compute cost.</text>
</svg>
