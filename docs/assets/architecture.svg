<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
<title id="title">Two paths, one discrete hierarchy</title>
<desc id="description">Training encodes text with a residual vector quantizer and decodes it. Generation predicts code positions together at each level, conditioned only on accumulated earlier-level vectors. EMA state is explicit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:36px;font-weight:700;fill:#10243a} .subtitle{font-size:20px;fill:#53677d} .label{font-size:22px;font-weight:700;fill:#10243a} .body{font-size:19px;fill:#53677d} .small{font-size:17px;fill:#53677d} .kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#2563eb}</style>
<rect x="0" y="0" width="1440" height="780" rx="0" fill="#f4f7fb" stroke="none"/>
<text x="44" y="44" class="kicker" text-anchor="start">NEXT-CONCEPT MODELING FOR TPU</text>
<text x="44" y="91" class="title" text-anchor="start">Two paths, one discrete hierarchy</text>
<text x="44" y="127" class="subtitle" text-anchor="start">Text codec + shared level-wise prior · explicit state · static masked arrays</text>
<rect x="40" y="157" width="1360" height="232" rx="14" fill="white" stroke="#d8e2ed"/>
<text x="66" y="195" class="kicker" text-anchor="start">01 / TOKENIZER LEARNING</text>
<rect x="68" y="222" width="198" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="68" y="222" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="167.0" y="261" class="label" text-anchor="middle">Input token IDs</text>
<text x="167.0" y="293" class="small" text-anchor="middle">valid + fallback masks</text>
<rect x="302" y="222" width="208" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="302" y="222" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="406.0" y="261" class="label" text-anchor="middle">Text encoder</text>
<text x="406.0" y="293" class="small" text-anchor="middle">residual 1D convolutions</text>
<rect x="546" y="222" width="240" height="100" rx="14" fill="#eaf8f4" stroke="#d8e2ed"/>
<rect x="546" y="222" width="5" height="100" rx="2" fill="#087f75" stroke="none"/>
<text x="666.0" y="261" class="label" text-anchor="middle">Multiscale RVQ</text>
<text x="666.0" y="293" class="small" text-anchor="middle">codes + cumulative vectors</text>
<rect x="822" y="222" width="208" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="822" y="222" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="926.0" y="261" class="label" text-anchor="middle">Text decoder</text>
<text x="926.0" y="293" class="small" text-anchor="middle">residual blocks + head</text>
<rect x="1066" y="222" width="304" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="1066" y="222" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="1218.0" y="261" class="label" text-anchor="middle">Token distributions</text>
<text x="1218.0" y="293" class="small" text-anchor="middle">masked reconstruction CE</text>
<polyline points="266,272 296,272" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="510,272 540,272" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="786,272 816,272" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="1030,272 1060,272" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="68" y="363" class="body" text-anchor="start">RVQ carries E [K,V,D], C [K,V], S [K,V,D]; padding and byte slots do not enter code statistics.</text>
<rect x="40" y="413" width="1360" height="287" rx="14" fill="white" stroke="#d8e2ed"/>
<text x="66" y="451" class="kicker" text-anchor="start">02 / FREE-RUNNING GENERATION</text>
<rect x="68" y="480" width="198" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="68" y="480" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="167.0" y="519" class="label" text-anchor="middle">Zero initial carry</text>
<text x="167.0" y="551" class="small" text-anchor="middle">known length / geometry</text>
<rect x="302" y="480" width="240" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="302" y="480" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="422.0" y="519" class="label" text-anchor="middle">Shared Transformer</text>
<text x="422.0" y="551" class="small" text-anchor="middle">resize + project prior carry</text>
<rect x="578" y="480" width="208" height="100" rx="14" fill="#f3effc" stroke="#d8e2ed"/>
<rect x="578" y="480" width="5" height="100" rx="2" fill="#7251b5" stroke="none"/>
<text x="682.0" y="519" class="label" text-anchor="middle">Level-k codes</text>
<text x="682.0" y="551" class="small" text-anchor="middle">all positions together</text>
<rect x="822" y="480" width="208" height="100" rx="14" fill="#eaf8f4" stroke="#d8e2ed"/>
<rect x="822" y="480" width="5" height="100" rx="2" fill="#087f75" stroke="none"/>
<text x="926.0" y="519" class="label" text-anchor="middle">Accumulate</text>
<text x="926.0" y="551" class="small" text-anchor="middle">embed + interpolate</text>
<rect x="1066" y="480" width="304" height="100" rx="14" fill="#eef4ff" stroke="#d8e2ed"/>
<rect x="1066" y="480" width="5" height="100" rx="2" fill="#2563eb" stroke="none"/>
<text x="1218.0" y="519" class="label" text-anchor="middle">Decode after level K</text>
<text x="1218.0" y="551" class="small" text-anchor="middle">add supplied byte features</text>
<polyline points="266,530 296,530" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="542,530 572,530" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="786,530 816,530" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="1030,530 1060,530" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="926,582 926,627 422,627 422,584" fill="none" stroke="#53677d" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="674" y="657" class="small" text-anchor="middle">Repeat coarse → fine; earlier-level predictions become the next context.</text>
<text x="44" y="742" class="body" text-anchor="start">Implemented in JAX/Flax. Rust data and orchestration tooling is planned. No trained weights are bundled.</text>
</svg>
