name: Functional and four-device validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XLA_FLAGS: --xla_force_host_platform_device_count=4
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c .github/validation-constraints.txt '.[test]'
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powered-verifier-evidence
          path: reports/validation-controls/power.json
