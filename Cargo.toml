[package]
name = "tpu-ncm"
version = "0.2.0"
edition = "2024"
description = "Native Rust core for Next-Concept Modeling"
license = "MIT"

[dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lib]
name = "ncm"
path = "rust/src/lib.rs"
