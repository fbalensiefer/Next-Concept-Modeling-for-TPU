[package]
name = "tpu-ncm"
version = "0.2.0"
edition = "2024"
description = "Rust orchestration for the JAX Next-Concept Modeling engine"
license = "MIT"

[lib]
name = "ncm"
path = "rust/src/lib.rs"

[[bin]]
name = "ncm-run"
path = "rust/src/bin/ncm-run.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
