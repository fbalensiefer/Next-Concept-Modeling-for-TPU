[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tpu-ncm"
version = "0.1.0"
description = "Functional multiscale next-concept modeling in JAX and Flax"
requires-python = ">=3.11"
dependencies = ["jax>=0.8.0,<0.11", "flax>=0.12,<0.13", "optax>=0.2.6,<0.3", "numpy>=2"]
readme = "README.md"
license = "MIT"
authors = [{name = "Fabian Balensiefer"}]

[project.urls]
Homepage = "https://github.com/fbalensiefer/Next-Concept-Modeling-for-TPU"
Repository = "https://github.com/fbalensiefer/Next-Concept-Modeling-for-TPU"
Paper = "https://github.com/fbalensiefer/Next-Concept-Modeling-for-TPU/blob/main/output/pdf/ncm_systems_paper.pdf"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
